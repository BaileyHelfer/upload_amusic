<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YT and Soundcloud MP3 Converter</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        #container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            padding: 32px;
            width: 100%;
            max-width: 480px;
            border: 1px solid #e2e8f0;
        }

        h1 {
            text-align: center;
            margin-bottom: 32px;
            font-size: 1.875rem;
            font-weight: 600;
            color: #1e293b;
            letter-spacing: -0.025em;
        }

        .input-container {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
            color: #374151;
            font-size: 0.875rem;
        }

        input[type="text"], select {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.2s ease;
            background: white;
            color: #374151;
        }

        input[type="text"]:focus, select:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        input[type="text"]:hover, select:hover {
            border-color: #9ca3af;
        }

        select {
            cursor: pointer;
            appearance: none;
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%236b7280' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");
            background-position: right 12px center;
            background-repeat: no-repeat;
            background-size: 16px;
            padding-right: 40px;
        }

        input[type="submit"] {
            width: 100%;
            padding: 14px;
            background: #3b82f6;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 8px;
        }

        input[type="submit"]:hover {
            background: #2563eb;
            transform: translateY(-1px);
            box-shadow: 0 4px 8px rgba(59, 130, 246, 0.2);
        }

        input[type="submit"]:active {
            transform: translateY(0);
        }

        input::placeholder {
            color: #9ca3af;
        }

        @media (max-width: 600px) {
            #container {
                padding: 24px;
                margin: 16px;
            }

            h1 {
                font-size: 1.5rem;
            }
        }

        /* Subtle animations */
        .input-container {
            transition: transform 0.2s ease;
        }

        .input-container:hover {
            transform: translateY(-1px);
        }
    </style>
</head>
<body>
    <div id="container">
        <h1>YT/Soundcloud MP3 Converter</h1>
        <form action="/download" method="post">
            <div class="input-container">
                <label for="url">URL:</label>
                <input type="text" id="url" name="url" placeholder="Enter YouTube or SoundCloud URL">
            </div>
            <div class="input-container">
                <label for="song_name">Song Name:</label>
                <input type="text" id="song_name" name="song_name" placeholder="Enter Song Name" required>
            </div>
            <div class="input-container">
                <label for="artist">Artist:</label>
                <select id="artist" name="artist" required>
                    <option value="">Select an artist</option>
                    {% for artist in artists %}
                        <option value="{{ artist }}">{{ artist }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="input-container">
                <input type="submit" value="Convert">
            </div>
        </form>
    </div>
</body>
</html>
