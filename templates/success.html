<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Complete</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            padding: 32px;
            width: 100%;
            max-width: 480px;
            border: 1px solid #e2e8f0;
            text-align: center;
        }

        h1 {
            margin-bottom: 16px;
            font-size: 1.875rem;
            font-weight: 600;
            color: #1e293b;
            letter-spacing: -0.025em;
        }

        p {
            color: #64748b;
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 24px;
        }

        .song-details {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 24px;
            text-align: left;
        }

        .song-details h2 {
            font-size: 1.25rem;
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 16px;
            text-align: center;
        }

        .song-details p {
            margin-bottom: 8px;
            color: #374151;
            font-size: 0.875rem;
        }

        .song-details p:last-child {
            margin-bottom: 0;
        }

        .song-details strong {
            color: #1e293b;
            font-weight: 500;
        }

        .button {
            display: inline-block;
            width: 100%;
            padding: 14px;
            background: #3b82f6;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            font-weight: 500;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }

        .button:hover {
            background: #2563eb;
            transform: translateY(-1px);
            box-shadow: 0 4px 8px rgba(59, 130, 246, 0.2);
        }

        .button:active {
            transform: translateY(0);
        }

        @media (max-width: 600px) {
            .container {
                padding: 24px;
                margin: 16px;
            }

            h1 {
                font-size: 1.5rem;
            }
        }

        /* Subtle animation on load */
        .container {
            animation: fadeInUp 0.5s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎉 Success!</h1>
        <p>Your song has been successfully uploaded to Apple Music.</p>
        <div class="song-details">
            <h2>Song Details</h2>
            <p><strong>Song Name:</strong> {{ song_name }}</p>
            <p><strong>Artist:</strong> {{ artist_name }}</p>
            <p><strong>Album:</strong> {{ album_name }}</p>
        </div>
        <a href="/" class="button">Upload Another Song</a>
    </div>
</body>
</html>
